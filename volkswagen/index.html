<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bild hochladen und überlagern</title>
</head>
<body>

<form method="post" enctype="multipart/form-data">
    <label>Wählen Sie ein Bild (*.png oder *.jpg) aus...
        <input id="fileInput" type="file" accept="image/png, image/jpeg"> 
    </label>  
    <button type="button" id="submitButton">...und dann hier klicken!</button>
</form>

<br>

<canvas id="canvas" style="border:1px solid black;"></canvas>

<script>
document.getElementById('submitButton').addEventListener('click', function() {
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Check if a file is selected
    if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                // Set canvas size to match the uploaded image size
                canvas.width = img.width;
                canvas.height = img.height;

                // Draw the uploaded image onto the canvas
                ctx.drawImage(img, 0, 0);

                // Load the transparent PNG overlay
                const overlay = new Image();
                overlay.src = 'transparent-overlay.png'; // Pfad zum transparenten PNG
                overlay.onload = function() {
                    // Calculate center position
                    const x = (canvas.width - overlay.width) / 2;
                    const y = (canvas.height - overlay.height) / 2;

                    // Draw the overlay on top of the uploaded image
                    ctx.drawImage(overlay, x, y);
                };
            };
            img.src = e.target.result;
        };
        
        reader.readAsDataURL(fileInput.files[0]);
    } else {
        alert("Bitte wählen Sie eine Bilddatei aus.");
    }
});
</script>

</body>
</html>
