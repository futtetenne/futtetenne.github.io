<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bild hochladen und Overlay anpassen</title>
</head>
<body>

<form method="post" enctype="multipart/form-data">
    <label>Wählen Sie ein Bild (*.png oder *.jpg) aus...
        <input id="fileInput" type="file" accept="image/png, image/jpeg"> 
    </label>  
    <button type="button" id="submitButton">...und dann hier klicken!</button>
</form>

<br>

<!-- Sliders für Position und Größe -->
<div>
    <label for="xPos">X Position: </label>
    <input type="range" id="xPos" min="0" max="100" value="50">
</div>

<div>
    <label for="yPos">Y Position: </label>
    <input type="range" id="yPos" min="0" max="100" value="50">
</div>

<div>
    <label for="scale">Skalierung (%): </label>
    <input type="range" id="scale" min="10" max="200" value="100">
</div>

<canvas id="canvas" style="border:1px solid black;"></canvas>

<script>
let uploadedImage = null;
let overlayImage = null;

// Sliders
const xPosSlider = document.getElementById('xPos');
const yPosSlider = document.getElementById('yPos');
const scaleSlider = document.getElementById('scale');

document.getElementById('submitButton').addEventListener('click', function() {
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        
        reader.onload = function(e) {
            uploadedImage = new Image();
            uploadedImage.onload = function() {
                canvas.width = uploadedImage.width;
                canvas.height = uploadedImage.height;
                
                // Zeichne das hochgeladene Bild und das Overlay
                drawImages();
            };
            uploadedImage.src = e.target.result;
        };
        
        reader.readAsDataURL(fileInput.files[0]);
        
        // Lade das Overlay-Bild
        overlayImage = new Image();
        overlayImage.src = 'transparent-overlay.png'; // Pfad zum Overlay
        overlayImage.onload = function() {
            drawImages();
        };
    } else {
        alert("Bitte wählen Sie eine Bilddatei aus.");
    }
});

function drawImages() {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    if (uploadedImage && overlayImage) {
        // Leere das Canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Zeichne das hochgeladene Bild
        ctx.drawImage(uploadedImage, 0, 0);

        // Berechne die Position basierend auf den Slidern
        const scaleFactor = scaleSlider.value / 100;
        const overlayWidth = overlayImage.width * scaleFactor;
        const overlayHeight = overlayImage.height * scaleFactor;

        const x = (canvas.width - overlayWidth) * (xPosSlider.value / 100);
        const y = (canvas.height - overlayHeight) * (yPosSlider.value / 100);

        // Zeichne das Overlay-Bild mit der berechneten Position und Größe
        ctx.drawImage(overlayImage, x, y, overlayWidth, overlayHeight);
    }
}

// Aktualisiere die Position und Größe dynamisch, wenn die Sliders bewegt werden
xPosSlider.addEventListener('input', drawImages);
yPosSlider.addEventListener('input', drawImages);
scaleSlider.addEventListener('input', drawImages);
</script>

</body>
</html>
