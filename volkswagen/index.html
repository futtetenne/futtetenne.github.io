<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bild hochladen und überlagern</title>
    <style>
        #controls {
            margin-top: 10px;
        }
        label {
            display: block;
        }
    </style>
</head>
<body>

<form method="post" enctype="multipart/form-data">
    <label>Wählen Sie ein Bild (*.png oder *.jpg) aus...
        <input id="fileInput" type="file" accept="image/png, image/jpeg"> 
    </label>  
    <button type="button" id="submitButton">...und dann hier klicken!</button>
</form>

<br>

<canvas id="canvas" style="border:1px solid black;"></canvas>

<div id="controls">
    <label>Position X:
        <input type="range" id="xPosition" min="0" max="100" value="50">
    </label>
    <label>Position Y:
        <input type="range" id="yPosition" min="0" max="100" value="50">
    </label>
</div>

<script>
document.getElementById('submitButton').addEventListener('click', function() {
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    // Check if a file is selected
    if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                // Load the transparent PNG overlay
                const overlay = new Image();
                overlay.src = 'transparent-overlay.png'; // Pfad zum transparenten PNG
                
                overlay.onload = function() {
                    // Set canvas size to match the overlay size
                    canvas.width = overlay.width;
                    canvas.height = overlay.height;

                    // Scale the uploaded image to the size of the overlay
                    ctx.drawImage(img, 0, 0, overlay.width, overlay.height);

                    // Initial drawing of the overlay at the center
                    drawOverlay(overlay, 50, 50);
                    
                    // Update overlay position as user moves sliders
                    document.getElementById('xPosition').addEventListener('input', function() {
                        const x = this.value;
                        const y = document.getElementById('yPosition').value;
                        drawOverlay(overlay, x, y);
                    });
                    
                    document.getElementById('yPosition').addEventListener('input', function() {
                        const y = this.value;
                        const x = document.getElementById('xPosition').value;
                        drawOverlay(overlay, x, y);
                    });
                };
            };
            img.src = e.target.result;
        };
        
        reader.readAsDataURL(fileInput.files[0]);
    } else {
        alert("Bitte wählen Sie eine Bilddatei aus.");
    }

    function drawOverlay(overlay, xPercent, yPercent) {
        // Clear the canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Re-draw the scaled uploaded image
        const img = new Image();
        img.src = fileInput.files[0] ? URL.createObjectURL(fileInput.files[0]) : '';
        img.onload = function() {
            ctx.drawImage(img, 0, 0, overlay.width, overlay.height);
            
            // Calculate new overlay position based on percentage
            const x = (canvas.width - overlay.width) * (xPercent / 100);
            const y = (canvas.height - overlay.height) * (yPercent / 100);

            // Draw the overlay at the new position
            ctx.drawImage(overlay, x, y);
        };
    }
});
</script>

</body>
</html>
