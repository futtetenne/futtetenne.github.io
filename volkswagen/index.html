<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bild hochladen und Overlay anpassen</title>
    <style>
        /* Farben */
        :root {
            --tuerkis: #40E0D0;
            --rot: #FF4136;
            --dunkeltuerkis: #008B8B;
            --schwarz: #111111;
        }

        /* Body Styling */
        body {
            font-family: Arial, sans-serif;
            background-color: var(--schwarz);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 10px;
        }

        /* Form Styling */
        form {
            background-color: var(--dunkeltuerkis);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            width: 100%;
            max-width: 500px;
        }

        label {
            font-weight: bold;
            color: var(--tuerkis);
        }

        input[type="file"] {
            color: var(--rot);
            font-weight: bold;
            margin-left: 10px;
        }

        button {
            background-color: var(--tuerkis);
            color: var(--schwarz);
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }

        button:hover {
            background-color: var(--rot);
        }

        /* Sliders */
        div {
            margin-bottom: 10px;
            width: 100%;
        }

        label {
            font-size: 14px;
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background-color: var(--dunkeltuerkis);
            height: 8px;
            border-radius: 5px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background-color: var(--rot);
            border-radius: 50%;
            cursor: pointer;
        }

        /* Canvas Styling */
        canvas {
            border: 3px solid var(--tuerkis);
            max-width: 100%;
            max-height: 60vh;
            margin: 20px auto;
            display: block;
            background-color: var(--schwarz);
        }

        /* Download Button */
        #downloadButton {
            background-color: var(--tuerkis);
            color: var(--schwarz);
            border: none;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }

        #downloadButton:hover {
            background-color: var(--rot);
        }

        /* Responsive Styling */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            form {
                width: 90%;
            }

            button, #downloadButton {
                width: 100%;
            }

            input[type="range"] {
                width: 100%;
            }

            canvas {
                max-width: 90vw;
                max-height: 50vh;
            }
        }

        /* Breite der Slider für mobile Geräte */
input[type="range"] {
    width: 100%; /* Macht den Slider so breit wie der Container */
    -webkit-appearance: none;
    appearance: none;
    background-color: var(--dunkeltuerkis);
    height: 12px; /* Erhöhe die Höhe des Sliders für eine bessere Bedienbarkeit */
    border-radius: 5px;
}

input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 30px; /* Breitere Schieberegler */
    height: 30px;
    background-color: var(--rot);
    border-radius: 50%;
    cursor: pointer;
}

input[type="range"]::-moz-range-thumb {
    width: 30px; /* Breitere Schieberegler */
    height: 30px;
    background-color: var(--rot);
    border-radius: 50%;
    cursor: pointer;
}

input[type="range"]::-ms-thumb {
    width: 30px; /* Breitere Schieberegler */
    height: 30px;
    background-color: var(--rot);
    border-radius: 50%;
    cursor: pointer;
}
    </style>
</head>
<body>

<form method="post" enctype="multipart/form-data">
    <label>Wählen Sie ein Bild (*.png oder *.jpg) aus...
        <input id="fileInput" type="file" accept="image/png, image/jpeg"> 
    </label>  
    <button type="button" id="submitButton">...und dann hier klicken!</button>
</form>

<!-- Sliders für Position und Größe -->
<div>
    <label for="xPos">X Position: </label>
    <input type="range" id="xPos" min="0" max="100" value="50">
</div>

<div>
    <label for="yPos">Y Position: </label>
    <input type="range" id="yPos" min="0" max="100" value="50">
</div>

<div>
    <label for="scale">Skalierung (%): </label>
    <input type="range" id="scale" min="10" max="200" value="100">
</div>

<canvas id="canvas"></canvas>

<!-- Download Button -->
<button id="downloadButton" style="display:none;">Download Bild</button>

<script>
let uploadedImage = null;
let overlayImage = null;
let canvasOriginalWidth = 0;
let canvasOriginalHeight = 0;

// Sliders
const xPosSlider = document.getElementById('xPos');
const yPosSlider = document.getElementById('yPos');
const scaleSlider = document.getElementById('scale');

document.getElementById('submitButton').addEventListener('click', function() {
    const fileInput = document.getElementById('fileInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        
        reader.onload = function(e) {
            uploadedImage = new Image();
            uploadedImage.onload = function() {
                // Speichere die Originalgröße
                canvasOriginalWidth = uploadedImage.width;
                canvasOriginalHeight = uploadedImage.height;
                
                // Vorschau: Begrenze die Größe des Canvas basierend auf der Fenstergröße
                const maxCanvasWidth = window.innerWidth * 0.9;
                const maxCanvasHeight = window.innerHeight * 0.8;
                
                const scaleFactor = Math.min(maxCanvasWidth / uploadedImage.width, maxCanvasHeight / uploadedImage.height);
                canvas.width = uploadedImage.width * scaleFactor;
                canvas.height = uploadedImage.height * scaleFactor;

                // Setze die Regler zurück
                xPosSlider.value = 50;
                yPosSlider.value = 50;
                scaleSlider.value = 100;

                // Zeichne das hochgeladene Bild und das Overlay
                drawImages();
                document.getElementById('downloadButton').style.display = 'block'; // Zeige den Download-Button
            };
            uploadedImage.src = e.target.result;
        };
        
        reader.readAsDataURL(fileInput.files[0]);
        
        // Lade das Overlay-Bild
        overlayImage = new Image();
        overlayImage.src = 'transparent-overlay.png'; // Pfad zum Overlay
        overlayImage.onload = function() {
            drawImages();
        };
    } else {
        alert("Bitte wählen Sie eine Bilddatei aus.");
    }
});

function drawImages(preview = true) {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    if (uploadedImage && overlayImage) {
        // Bestimme die Bildgröße (Vorschau vs Originalgröße)
        const canvasWidth = preview ? canvas.width : canvasOriginalWidth;
        const canvasHeight = preview ? canvas.height : canvasOriginalHeight;
        
        // Leere das Canvas
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Zeichne das hochgeladene Bild
        ctx.drawImage(uploadedImage, 0, 0, canvasWidth, canvasHeight);

        // Berechne die Skalierung des Overlays
        const scaleFactor = canvasHeight / overlayImage.height;
        const overlayWidth = overlayImage.width * scaleFactor * (scaleSlider.value / 100);
        const overlayHeight = overlayImage.height * scaleFactor * (scaleSlider.value / 100);

        // Berechne die Position basierend auf den Slidern
        const x = (canvasWidth - overlayWidth) * (xPosSlider.value / 100);
        const y = (canvasHeight - overlayHeight) * (yPosSlider.value / 100);

        // Zeichne das Overlay-Bild mit der berechneten Position und Größe
        ctx.drawImage(overlayImage, x, y, overlayWidth, overlayHeight);
    }
}

// Aktualisiere die Position und Größe dynamisch, wenn die Sliders bewegt werden
xPosSlider.addEventListener('input', () => drawImages(true));
yPosSlider.addEventListener('input', () => drawImages(true));
scaleSlider.addEventListener('input', () => drawImages(true));

// Funktion zum Herunterladen des Canvas-Inhalts in voller Qualität
document.getElementById('downloadButton').addEventListener('click', function() {
    const canvas = document.getElementById('canvas');
    const originalWidth = canvasOriginalWidth;
    const originalHeight = canvasOriginalHeight;

    // Erstellt ein verstecktes Canvas mit der Originalgröße
    const tempCanvas = document.createElement('canvas');
    const tempCtx = tempCanvas.getContext('2d');
    tempCanvas.width = originalWidth;
    tempCanvas.height = originalHeight;

    // Zeichne das hochgeladene Bild auf das versteckte Canvas
    tempCtx.drawImage(uploadedImage, 0, 0, originalWidth, originalHeight);

    // Berechne die Skalierung des Overlays für die Originalgröße
    const scaleFactor = originalHeight / overlayImage.height;
    const overlayWidth = overlayImage.width * scaleFactor * (scaleSlider.value / 100);
    const overlayHeight = overlayImage.height * scaleFactor * (scaleSlider.value / 100);

    // Berechne die Position basierend auf den Slidern für die Originalgröße
    const x = (originalWidth - overlayWidth) * (xPosSlider.value / 100);
    const y = (originalHeight - overlayHeight) * (yPosSlider.value / 100);

    // Zeichne das Overlay-Bild mit der berechneten Position und Größe auf das versteckte Canvas
    tempCtx.drawImage(overlayImage, x, y, overlayWidth, overlayHeight);

    // Erstelle einen Download-Link für das versteckte Canvas
    const link = document.createElement('a');
    link.href = tempCanvas.toDataURL('image/png');
    link.download = 'erstelltes_bild.png';
    link.click();
});
</script>

</body>
</html>
